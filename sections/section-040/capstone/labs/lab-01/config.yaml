# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Containerization Capstone (LAB). Graded against the live cluster. UNTESTED: built from static checks only.
apiVersion: astrona.io/v1
metadata:
  name: ats-037-capstone-040
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0
      - busybox:1.37.0

# Starting state: the faults are left in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: leaky-fixed
      description: "leaky keeps its image, a memory limit of at least 128Mi and has 1 ready replica"
      type: file
      source: validation/validate-leaky-fixed.sh
      hint: "Read the last termination reason, then raise the limit."
    - name: fetcher-running
      description: "fetcher uses podinfo:6.15.0 and has 1 ready replica"
      type: file
      source: validation/validate-fetcher-running.sh
      hint: "Read the pull error in the Pod events."
    - name: pipeline-init
      description: "Pod pipeline has a completed init container generate and worker printed mode=night"
      type: file
      source: validation/validate-pipeline-init.sh
      hint: "Share one emptyDir volume between the containers."
    - name: pipeline-sidecar
      description: "pipeline has an init container watcher with restartPolicy Always, and watcher and worker run"
      type: file
      source: validation/validate-pipeline-sidecar.sh
      hint: "Put restartPolicy: Always on the init container."
    - name: container-notes
      description: "container-notes records the live runtime name and the digest of the running fetcher image"
      type: file
      source: validation/validate-container-notes.sh
      hint: "Read nodeInfo and the imageID, then cut the prefix and the suffix."

teardown:
  keepCluster: false
