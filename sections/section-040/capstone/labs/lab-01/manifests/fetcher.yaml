# Fault left in place on purpose: the image tag does not exist, so the Pod cannot pull its image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fetcher
  namespace: starfleet
  labels:
    app: fetcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fetcher
  template:
    metadata:
      labels:
        app: fetcher
    spec:
      containers:
        - name: fetcher
          image: ghcr.io/stefanprodan/podinfo:6.15.99
