# Fault left in place on purpose: the memory limit is smaller than the real need, so the container is OOMKilled again and again.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hog
  namespace: starfleet
  labels:
    app: hog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hog
  template:
    metadata:
      labels:
        app: hog
    spec:
      containers:
        - name: hog
          image: busybox:1.37.0
          command: ["sh", "-c", "a=$(head -c 30000000 /dev/zero | tr '\\0' x); sleep 3600"]
          resources:
            limits:
              memory: 16Mi
