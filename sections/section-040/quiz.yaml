# Knowledge check for section 040. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats037-040
course_id: ATS037
exam_code: KCNA
status: draft
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: section
  id: section-040
  title: Containerization
questions:
- id: ats037-040-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Describe how namespaces and cgroups affect Linux processes.
  source_readings:
  - sections/section-040/module-01/course-01-processes-namespaces-and-control-groups.md
  prompt: Which Linux mechanism constrains resource use for groups of container processes?
  options:
  - id: a
    text: Container image tags.
    explanation: They identify artifact references rather than resource enforcement.
  - id: b
    text: Control groups, or cgroups.
    explanation: They account for and constrain resource usage.
  - id: c
    text: Kubernetes namespaces alone.
    explanation: They scope API resources rather than enforcing Linux process usage
      limits.
  correct_option: b
  explanation: They account for and constrain resource usage.
- id: ats037-040-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish the CRI from image and runtime standards.
  source_readings:
  - sections/section-040/module-01/course-02-runtimes-and-kubernetes-integration.md
  prompt: Which interface does the kubelet use to request container runtime operations?
  options:
  - id: a
    text: Container Runtime Interface, or CRI.
    explanation: It defines Kubernetes-to-runtime integration.
  - id: b
    text: Container Storage Interface, or CSI.
    explanation: It addresses storage integration.
  - id: c
    text: An OCI image digest.
    explanation: It identifies content rather than providing the kubelet runtime API.
  correct_option: a
  explanation: It defines Kubernetes-to-runtime integration.
- id: ats037-040-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish a tag from a digest.
  source_readings:
  - sections/section-040/module-02/course-01-layers-tags-and-digests.md
  prompt: A release needs precise artifact identity even if a tag is later moved.
    Which reference is most suitable?
  options:
  - id: a
    text: The tag latest.
    explanation: Tags can be reassigned to different content.
  - id: b
    text: The Pod's display name.
    explanation: A workload name does not identify its image bytes.
  - id: c
    text: An image digest.
    explanation: It identifies content through a cryptographic hash.
  correct_option: c
  explanation: It identifies content through a cryptographic hash.
- id: ats037-040-q04
  type: single_choice
  difficulty: beginner
  learning_objective: Identify common causes of image pull failure.
  source_readings:
  - sections/section-040/module-02/course-02-from-build-to-image-pull.md
  prompt: The runtime reports that an image tag does not exist. What should be checked
    first?
  options:
  - id: a
    text: Whether a Service has a port 80 listener.
    explanation: Traffic configuration is not the cause of this image pull error.
  - id: b
    text: The exact published image reference and artifact existence.
    explanation: The reported dependency failure concerns obtaining the artifact.
  - id: c
    text: The HPA's utilization target.
    explanation: Replica scaling does not create the missing registry artifact.
  correct_option: b
  explanation: The reported dependency failure concerns obtaining the artifact.
- id: ats037-040-q05
  type: single_choice
  difficulty: beginner
  learning_objective: Explain command, arguments and environment settings at startup.
  source_readings:
  - sections/section-040/module-03/course-01-startup-configuration-and-application-state.md
  prompt: A container command array contains shell redirection but does not invoke
    a shell. Why might it fail?
  options:
  - id: a
    text: Kubernetes does not automatically interpret the array as shell syntax.
    explanation: Shell operators require a deliberately invoked shell or another interpreter.
  - id: b
    text: Every container command implicitly uses a shell.
    explanation: The array can execute a program directly.
  - id: c
    text: Changing a ConfigMap automatically rebuilds the executable.
    explanation: Configuration updates do not rebuild images or alter command interpretation.
  correct_option: a
  explanation: Shell operators require a deliberately invoked shell or another interpreter.
- id: ats037-040-q06
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish init containers from sidecar patterns.
  source_readings:
  - sections/section-040/module-03/course-02-init-containers-and-sidecar-patterns.md
  prompt: A helper must generate a file and finish before the application starts.
    Which pattern fits?
  options:
  - id: a
    text: An unrelated sidecar that never completes, without a shared mount.
    explanation: That does not supply the required completion gate or file sharing.
  - id: b
    text: A CronJob solely to set the Pod's local file.
    explanation: A separately scheduled task is not this Pod's ordered initialization
      mechanism.
  - id: c
    text: A regular init container with an explicitly shared volume.
    explanation: Regular init completion gates application startup, and mounts provide
      file sharing.
  correct_option: c
  explanation: Regular init completion gates application startup, and mounts provide
    file sharing.
- id: ats037-040-q07
  type: single_choice
  difficulty: beginner
  learning_objective: Describe how namespaces and cgroups affect Linux processes.
  source_readings:
  - sections/section-040/module-01/course-01-processes-namespaces-and-control-groups.md
  prompt: Two containers run on the same node. Which kernel do they use?
  options:
  - id: a
    text: Each container boots its own kernel.
    explanation: That describes a virtual machine.
  - id: b
    text: Both use the kernel of the node.
    explanation: Correct. Containers are isolated processes of one kernel, separated
      by namespaces and limited by control groups.
  - id: c
    text: The kernel that is packaged in the image.
    explanation: An image contains files and no running kernel.
  - id: d
    text: A kernel that the kubelet provides.
    explanation: The kubelet is a process, not a kernel.
  correct_option: b
  explanation: Containers share the host kernel. That is why a Linux container image
    cannot run a different kernel version.
- id: ats037-040-q08
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish the CRI from image and runtime standards.
  source_readings:
  - sections/section-040/module-01/course-02-runtimes-and-kubernetes-integration.md
  prompt: Which pair are container runtimes that implement the Container Runtime Interface
    used by the kubelet?
  options:
  - id: a
    text: containerd and CRI-O.
    explanation: Correct. Both receive requests from the kubelet through the CRI and
      use a low-level runtime to start containers.
  - id: b
    text: etcd and kube-proxy.
    explanation: These are a datastore and a network component.
  - id: c
    text: runc and the OCI image specification.
    explanation: runc is a low-level runtime and the image specification is a format,
      not a CRI implementation.
  - id: d
    text: kubectl and kubeadm.
    explanation: These are command-line tools.
  correct_option: a
  explanation: The kubelet speaks the CRI to a runtime such as containerd or CRI-O.
    The runtime then uses an OCI runtime such as runc.
- id: ats037-040-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish a tag from a digest.
  source_readings:
  - sections/section-040/module-02/course-01-layers-tags-and-digests.md
  prompt: A team wants every cluster to run exactly the same image content, even if
    someone later pushes a new image under the same tag. What should the Pod specification
    use?
  options:
  - id: a
    text: The tag `latest`.
    explanation: "`latest` is a tag that can point to new content at any time."
  - id: b
    text: A digest, such as `repository@sha256:...`.
    explanation: Correct. A digest identifies the content and cannot point to different
      content.
  - id: c
    text: A shorter tag.
    explanation: Any tag can be moved.
  - id: d
    text: "`imagePullPolicy: Never`."
    explanation: This only stops pulls. A node without the image would fail.
  correct_option: b
  explanation: A tag is a movable name. A digest is a hash of the manifest and always
    names the same content.
- id: ats037-040-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Identify common causes of image pull failure.
  source_readings:
  - sections/section-040/module-02/course-02-from-build-to-image-pull.md
  prompt: 'A Pod uses the image `registry.example/app:2.0` with `imagePullPolicy:
    IfNotPresent`. The node already holds that image. What happens at start?'
  options:
  - id: a
    text: The kubelet always checks the registry first.
    explanation: That is the behavior of `Always`.
  - id: b
    text: The kubelet uses the image on the node and does not contact the registry.
    explanation: Correct. `IfNotPresent` pulls only when the image is missing on the
      node.
  - id: c
    text: The Pod fails because the pull policy needs a digest.
    explanation: The policy works with tags and digests.
  - id: d
    text: The scheduler pulls the image.
    explanation: Only the runtime on the node pulls images.
  correct_option: b
  explanation: The kubelet follows the pull policy. With `IfNotPresent` a cached image
    is reused without a network call.
- id: ats037-040-q11
  type: single_choice
  difficulty: beginner
  learning_objective: Explain command, arguments and environment settings at startup.
  source_readings:
  - sections/section-040/module-03/course-01-startup-configuration-and-application-state.md
  prompt: A Pod specification sets `command` and `args` for a container. Which image
    settings do they replace?
  options:
  - id: a
    text: "`command` replaces ENTRYPOINT and `args` replaces CMD."
    explanation: Correct. A field that you leave out keeps the value from the image.
  - id: b
    text: "`command` replaces CMD and `args` replaces ENTRYPOINT."
    explanation: The two are the other way around.
  - id: c
    text: Both replace the environment variables of the image.
    explanation: Environment variables are set by `env`.
  - id: d
    text: They replace the base image.
    explanation: The image is chosen by the `image` field.
  correct_option: a
  explanation: In a Pod specification `command` overrides the image ENTRYPOINT and
    `args` overrides the image CMD.
- id: ats037-040-q12
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish init containers from sidecar patterns.
  source_readings:
  - sections/section-040/module-03/course-02-init-containers-and-sidecar-patterns.md
  prompt: An init container of a Pod exits with a non-zero code. What happens to the
    application containers?
  options:
  - id: a
    text: They start anyway, because init containers are optional.
    explanation: Init containers must succeed before the application containers start.
  - id: b
    text: They do not start while the init container keeps failing. The kubelet retries
      the init container.
    explanation: Correct. Init containers run one after another and each must complete
      successfully first.
  - id: c
    text: They start in parallel and restart the init container.
    explanation: The order is strict.
  - id: d
    text: The Pod is moved to another node immediately.
    explanation: The kubelet retries on the same node.
  correct_option: b
  explanation: Application containers wait for all init containers to finish successfully.
    A repeated failure shows as an Init status on the Pod.
