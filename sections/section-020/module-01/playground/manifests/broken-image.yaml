apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-image
  namespace: starfleet
  labels:
    app: broken-image
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-image
  template:
    metadata:
      labels:
        app: broken-image
    spec:
      containers:
        - name: broken-image
          image: ghcr.io/stefanprodan/podinfo:6.15.99
