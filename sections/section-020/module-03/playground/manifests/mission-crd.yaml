apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: missions.starfleet.example.com
spec:
  group: starfleet.example.com
  scope: Namespaced
  names:
    plural: missions
    singular: mission
    kind: Mission
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["objective", "crewSize"]
              properties:
                objective:
                  type: string
                crewSize:
                  type: integer
                  minimum: 1
