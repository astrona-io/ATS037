apiVersion: apps/v1
kind: Deployment
metadata:
  name: convoy
  namespace: starfleet
  labels:
    app: convoy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: convoy
  template:
    metadata:
      labels:
        app: convoy
    spec:
      containers:
        - name: convoy
          image: ghcr.io/stefanprodan/podinfo:6.15.0
