# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Configuration And Resource Management Lab (LAB). Graded against the live cluster. UNTESTED: built from static checks only.
apiVersion: astrona.io/v1
metadata:
  name: ats-037-lab-020-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0
      - busybox:1.37.0

# Starting state: the faults are left in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: config-objects
      description: "ConfigMap app-settings and Secret app-key hold the required values"
      type: file
      source: validation/validate-config-objects.sh
      hint: "Create both with kubectl create and --from-literal."
    - name: reader-pod
      description: "reader is ready, takes LOG_LEVEL from the ConfigMap and mounts the Secret at /etc/key"
      type: file
      source: validation/validate-reader-pod.sh
      hint: "Use configMapKeyRef for the variable and a secret volume mounted at /etc/key."
    - name: ballast-resources
      description: "ballast has requests 50m and 64Mi, a 128Mi memory limit and 2 available replicas"
      type: file
      source: validation/validate-ballast-resources.sh
      hint: "Use kubectl set resources on deployment/ballast."
    - name: outpost-quota
      description: "outpost-budget allows 5 Pods and 10 ConfigMaps in outpost"
      type: file
      source: validation/validate-outpost-quota.sh
      hint: "kubectl create quota with --hard=pods=5,configmaps=10 in the outpost namespace."

teardown:
  keepCluster: false
