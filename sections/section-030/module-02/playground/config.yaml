# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Placement And Scaling (PLAYGROUND): a clean sandbox with the Starfleet workloads.
# No task, no grading, no `astrona submit`. Built from static checks only (untested).
apiVersion: astrona.io/v1
metadata:
  name: ats-037-playground-030-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0
      - busybox:1.37.0

bootstrap:
  manifests:
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
    - name: engine
      type: file
      source: manifests/engine.yaml
  waitFor:
    - resource: deploy/scout
      namespace: starfleet
    - resource: deploy/probe
      namespace: starfleet
    - resource: deploy/shuttle
      namespace: starfleet
    - resource: deploy/drifter
      namespace: outpost

teardown:
  keepCluster: false
