apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine
  namespace: starfleet
  labels:
    app: engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: engine
  template:
    metadata:
      labels:
        app: engine
    spec:
      containers:
        - name: engine
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
