# Knowledge check for section 030. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats037-030
course_id: ATS037
exam_code: KCNA
status: draft
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: section
  id: section-030
  title: Scheduling
questions:
- id: ats037-030-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Compare required placement rules with preferences.
  source_readings:
  - sections/section-030/module-01/course-01-filtering-scoring-and-placement-rules.md
  prompt: A Pod prefers zone A but all suitable capacity is in zone B. Its rule is
    preferred affinity. What can happen?
  options:
  - id: a
    text: It ignores every resource request.
    explanation: Preferences do not bypass resource eligibility checks.
  - id: b
    text: The scheduler may place it in zone B.
    explanation: Preferences influence scores without making zone A mandatory.
  - id: c
    text: It must remain Pending forever solely because zone A is unavailable.
    explanation: A preferred rule is not a hard placement restriction.
  correct_option: b
  explanation: Preferences influence scores without making zone A mandatory.
- id: ats037-030-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Predict the effect of taints and tolerations.
  source_readings:
  - sections/section-030/module-01/course-02-taints-tolerations-and-eligibility.md
  prompt: A Pod tolerates a dedicated-node taint but has no node affinity. Must it
    run on the dedicated node?
  options:
  - id: a
    text: No; the toleration permits the taint but does not require that node.
    explanation: Other suitable nodes can still be selected.
  - id: b
    text: Yes; every toleration attracts Pods to its tainted node.
    explanation: Tolerations remove a restriction rather than adding attraction.
  - id: c
    text: No; a toleration blocks all tainted nodes.
    explanation: A matching toleration permits the relevant taint.
  correct_option: a
  explanation: Other suitable nodes can still be selected.
- id: ats037-030-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Predict the effect of taints and tolerations.
  source_readings:
  - sections/section-030/module-01/course-02-taints-tolerations-and-eligibility.md
  prompt: A taint should evict already running Pods that do not tolerate it. Which
    effect expresses that behavior?
  options:
  - id: a
    text: NoSchedule.
    explanation: It blocks new placement but does not by itself evict existing Pods.
  - id: b
    text: PreferNoSchedule.
    explanation: It is a soft placement preference rather than the requested eviction
      behavior.
  - id: c
    text: NoExecute.
    explanation: It can affect existing Pods as well as new placement.
  correct_option: c
  explanation: It can affect existing Pods as well as new placement.
- id: ats037-030-q04
  type: single_choice
  difficulty: beginner
  learning_objective: Explain why a resource request can leave a Pod Pending.
  source_readings:
  - sections/section-030/module-02/course-01-capacity-and-pending-pods.md
  prompt: A Pod requests two CPUs; each eligible node has one CPU left in allocatable
    requested capacity. Why can it remain Pending?
  options:
  - id: a
    text: Its image tag automatically reserves CPU.
    explanation: Image naming does not supply requested node capacity.
  - id: b
    text: No individual eligible node can fit its request.
    explanation: Capacity across nodes cannot arbitrarily be combined for one Pod.
  - id: c
    text: The scheduler must split the Pod across two nodes.
    explanation: A normal Pod is assigned as a unit to one node.
  correct_option: b
  explanation: Capacity across nodes cannot arbitrarily be combined for one Pod.
- id: ats037-030-q05
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish replica changes from node capacity changes.
  source_readings:
  - sections/section-030/module-02/course-02-replica-autoscaling-and-availability.md
  prompt: An HPA requests ten replicas but only six fit. Which separate mechanism
    can increase worker capacity?
  options:
  - id: a
    text: Node autoscaling, if suitable infrastructure and configuration are available.
    explanation: Replica scaling and node provisioning are separate operations.
  - id: b
    text: The HPA itself must install four worker nodes.
    explanation: The HPA adjusts replicas rather than directly creating nodes.
  - id: c
    text: Changing the Service name.
    explanation: Service identity does not add compute capacity.
  correct_option: a
  explanation: Replica scaling and node provisioning are separate operations.
- id: ats037-030-q06
  type: single_choice
  difficulty: beginner
  learning_objective: Relate placement and disruption handling to application availability.
  source_readings:
  - sections/section-030/module-02/course-02-replica-autoscaling-and-availability.md
  prompt: A team uses a PodDisruptionBudget. Which statement correctly describes its
    protection?
  options:
  - id: a
    text: It guarantees that node failures never interrupt service.
    explanation: Involuntary failures remain possible.
  - id: b
    text: It creates extra nodes whenever availability is low.
    explanation: A disruption budget does not provision capacity.
  - id: c
    text: It limits certain voluntary disruptions but does not prevent hardware failure.
    explanation: A budget controls supported disruption operations rather than all
      failure causes.
  correct_option: c
  explanation: A budget controls supported disruption operations rather than all failure
    causes.
- id: ats037-030-q07
  type: single_choice
  difficulty: beginner
  learning_objective: Compare required placement rules with preferences.
  source_readings:
  - sections/section-030/module-01/course-01-filtering-scoring-and-placement-rules.md
  prompt: 'A Pod has `nodeSelector: {disktype: ssd}` and no node has that label. What
    do you see?'
  options:
  - id: a
    text: The Pod runs on any node, because the selector is a preference.
    explanation: A node selector is a hard requirement, not a preference.
  - id: b
    text: The Pod stays Pending, and its events report that no node matched the node
      selector.
    explanation: Correct. Filtering removes every node, so no node is left to score.
  - id: c
    text: The Pod is rejected by the API server.
    explanation: The API server does not know which labels nodes will have.
  - id: d
    text: The kubelet adds the label to a node.
    explanation: No component adds labels because of a selector.
  correct_option: b
  explanation: A node selector is a filter. When no node passes the filters, the Pod
    stays Pending with a FailedScheduling event.
- id: ats037-030-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Compare required placement rules with preferences.
  source_readings:
  - sections/section-030/module-01/course-01-filtering-scoring-and-placement-rules.md
  prompt: In which order does the scheduler work on a Pod?
  options:
  - id: a
    text: It scores all nodes, then filters out the nodes that cannot run the Pod.
    explanation: Scoring happens on the nodes that remain after filtering.
  - id: b
    text: It filters out the nodes that cannot run the Pod, then scores the remaining
      nodes and picks the best one.
    explanation: Correct. Filtering applies the hard rules. Scoring ranks the feasible
      nodes.
  - id: c
    text: It picks a random node, and the kubelet rejects it if it does not fit.
    explanation: The scheduler decides before the kubelet is involved.
  - id: d
    text: It asks each kubelet to bid for the Pod.
    explanation: Kubelets do not take part in the choice.
  correct_option: b
  explanation: Filtering removes nodes that fail a requirement. Scoring ranks what
    is left.
- id: ats037-030-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Predict the effect of taints and tolerations.
  source_readings:
  - sections/section-030/module-01/course-02-taints-tolerations-and-eligibility.md
  prompt: A node gets the taint `reserved=science:NoExecute`. A running Pod has no
    matching toleration. What happens to it?
  options:
  - id: a
    text: Nothing. Only new Pods are affected.
    explanation: That describes NoSchedule. NoExecute also affects running Pods.
  - id: b
    text: The Pod is evicted from the node.
    explanation: Correct. NoExecute removes running Pods that do not tolerate the
      taint.
  - id: c
    text: The Pod is frozen but keeps its place.
    explanation: Kubernetes has no such state.
  - id: d
    text: The taint is removed from the node.
    explanation: Pods cannot remove taints.
  correct_option: b
  explanation: NoSchedule blocks new placement. NoExecute also evicts running Pods
    that lack a matching toleration.
- id: ats037-030-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Predict the effect of taints and tolerations.
  source_readings:
  - sections/section-030/module-01/course-02-taints-tolerations-and-eligibility.md
  prompt: A Pod tolerates the taint `reserved=science:NoSchedule` and has no other
    placement rule. Which statement is true?
  options:
  - id: a
    text: The Pod must run on the tainted node.
    explanation: A toleration allows a node. It does not attract the Pod to it.
  - id: b
    text: The Pod may run on the tainted node, but the scheduler can also choose an
      untainted node.
    explanation: Correct. A toleration removes an obstacle only.
  - id: c
    text: The Pod can run only on tainted nodes.
    explanation: The toleration does not limit the Pod to tainted nodes.
  - id: d
    text: The Pod ignores all other taints.
    explanation: A toleration matches only the taint it names.
  correct_option: b
  explanation: To keep a Pod on a reserved node, combine the toleration with a node
    selector or affinity.
- id: ats037-030-q11
  type: single_choice
  difficulty: beginner
  learning_objective: Explain why a resource request can leave a Pod Pending.
  source_readings:
  - sections/section-030/module-02/course-01-capacity-and-pending-pods.md
  prompt: Which value does the scheduler compare with the free capacity of a node
    when it places a Pod?
  options:
  - id: a
    text: The memory and CPU that the Pod used last hour.
    explanation: The scheduler does not use measured usage.
  - id: b
    text: The limits of the containers.
    explanation: Limits are enforced by the node, not used for placement.
  - id: c
    text: The requests of the containers.
    explanation: Correct. The scheduler adds up requests and compares them with the
      allocatable capacity that is not yet requested.
  - id: d
    text: The size of the container image.
    explanation: Image size does not take part in the capacity check.
  correct_option: c
  explanation: Requests reserve capacity for scheduling. A request larger than any
    node can offer leaves the Pod Pending with an Insufficient cpu or Insufficient
    memory event.
- id: ats037-030-q12
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish replica changes from node capacity changes.
  source_readings:
  - sections/section-030/module-02/course-02-replica-autoscaling-and-availability.md
  prompt: A HorizontalPodAutoscaler shows `<unknown>` as its CPU target value. Which
    cause is most likely in a cluster that has no metrics server?
  options:
  - id: a
    text: The Deployment has too many replicas.
    explanation: The replica count does not hide the metric.
  - id: b
    text: No component supplies the resource metrics, so the autoscaler cannot compute
      utilization.
    explanation: Correct. The autoscaler reads resource metrics from the metrics API,
      which a metrics server provides.
  - id: c
    text: The Pods have no labels.
    explanation: Labels select the Pods but do not provide metrics.
  - id: d
    text: The scheduler has not run.
    explanation: The scheduler does not supply metrics.
  correct_option: b
  explanation: Resource-based autoscaling needs the metrics API and a CPU request
    on the containers. Without metrics the value stays unknown.
