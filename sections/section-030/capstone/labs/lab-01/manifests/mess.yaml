# Fault left in place on purpose: no node has the label zone=east, so the Pods stay Pending.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mess
  namespace: starfleet
  labels:
    app: mess
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mess
  template:
    metadata:
      labels:
        app: mess
    spec:
      nodeSelector:
        zone: east
      containers:
        - name: mess
          image: ghcr.io/stefanprodan/podinfo:6.15.0
