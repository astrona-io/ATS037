# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Pods And Their Lifecycle Lab (LAB). Graded against the live cluster. UNTESTED: built from static checks only.
apiVersion: astrona.io/v1
metadata:
  name: ats-037-lab-010-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0
      - busybox:1.37.0

# Starting state: the faults are left in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: beacon-probes-fixed
      description: "beacon keeps both probes with the right path and port and both replicas are available"
      type: file
      source: validation/validate-beacon-probes-fixed.sh
      hint: "Liveness path /healthz, readiness path /readyz on the named port http. Do not remove a probe."
    - name: beacon-startup-probe
      description: "beacon has a startup probe on /healthz that allows at least 10 failures"
      type: file
      source: validation/validate-beacon-startup-probe.sh
      hint: "Add startupProbe with httpGet /healthz and failureThreshold 10 or more."
    - name: exchange-shared-volume
      description: "The Pod exchange has two ready containers that mount the same emptyDir volume"
      type: file
      source: validation/validate-exchange-shared-volume.sh
      hint: "Declare one emptyDir volume and mount it in both containers."

teardown:
  keepCluster: false
