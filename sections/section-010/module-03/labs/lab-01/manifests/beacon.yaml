# The faults are left in place on purpose: wrong liveness path, wrong readiness port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon
  namespace: starfleet
  labels:
    app: beacon
spec:
  replicas: 2
  selector:
    matchLabels:
      app: beacon
  template:
    metadata:
      labels:
        app: beacon
    spec:
      containers:
        - name: beacon
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          livenessProbe:
            httpGet:
              path: /nope
              port: http
            periodSeconds: 5
            failureThreshold: 1
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: beacon
  namespace: starfleet
spec:
  selector:
    app: beacon
  ports:
    - name: http
      port: 80
      targetPort: http
