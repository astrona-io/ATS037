# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Cluster Architecture Lab (LAB). Graded against the live cluster. UNTESTED: built from static checks only.
apiVersion: astrona.io/v1
metadata:
  name: ats-037-lab-010-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0
    nodes:
      workers: 1

# Starting state: the faults are left in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: control-plane-map
      description: "The ConfigMap control-plane-map names the Pods of the four control plane components"
      type: file
      source: validation/validate-control-plane-map.sh
      hint: "Use the component label in kube-system: kube-apiserver, etcd, kube-scheduler, kube-controller-manager."
    - name: scout-scaled
      description: "The Deployment scout asks for 3 replicas and 3 are ready"
      type: file
      source: validation/validate-scout-scaled.sh
      hint: "Scale the Deployment, not the Pods or the ReplicaSet, and wait for the rollout."
    - name: shuttle-node
      description: "The ConfigMap node-evidence records the node that runs shuttle"
      type: file
      source: validation/validate-shuttle-node.sh
      hint: "Read spec.nodeName of the shuttle Pod."

teardown:
  keepCluster: false
