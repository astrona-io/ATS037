# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Kubernetes API And Resources Lab (LAB). Graded against the live cluster. UNTESTED: built from static checks only.
apiVersion: astrona.io/v1
metadata:
  name: ats-037-lab-010-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the faults are left in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: service-selects-pods
      description: "The Service bridge has ready endpoints and the Pod labels are unchanged"
      type: file
      source: validation/validate-service-selects-pods.sh
      hint: "Change the Service selector to app=bridge. Leave the Pods alone."
    - name: tier-label-and-annotation
      description: "Every running bridge Pod has tier=frontend and the Deployment has the annotation contact=ops"
      type: file
      source: validation/validate-tier-label-and-annotation.sh
      hint: "Patch spec.template.metadata.labels for the label; annotate the Deployment for the annotation."
    - name: api-facts
      description: "The ConfigMap api-facts holds the owner kind, the Deployment apiVersion and the scope of nodes"
      type: file
      source: validation/validate-api-facts.sh
      hint: "Use ownerReferences, kubectl explain and kubectl api-resources."

teardown:
  keepCluster: false
