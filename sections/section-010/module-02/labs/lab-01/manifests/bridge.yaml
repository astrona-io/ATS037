apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge
  namespace: starfleet
  labels:
    app: bridge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bridge
  template:
    metadata:
      labels:
        app: bridge
    spec:
      containers:
        - name: bridge
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bridge
  namespace: starfleet
spec:
  selector:
    app: bridge-web
  ports:
    - name: http
      port: 80
      targetPort: http
