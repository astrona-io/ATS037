questions:
- id: ats037-domain-review-q01
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain how reconciliation restores a declared replica count.
  source_readings:
  - sections/section-010/module-01/course-02-desired-state-and-reconciliation.md
  prompt: A deleted scout Pod is replaced, but the replacement stays Pending because no node fits. Which
    explanation connects both observations?
  options:
  - id: a
    text: The API server must directly execute the replacement.
    explanation: Execution belongs to node components after assignment.
  - id: b
    text: The controller restored the object count, while scheduling could not satisfy placement.
    explanation: Reconciliation can create an object before usable node capacity exists.
  - id: c
    text: The runtime failed to encrypt etcd.
    explanation: That does not follow from replica replacement and insufficient fit.
  correct_option: b
  explanation: Reconciliation can create an object before usable node capacity exists.
- id: ats037-domain-review-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Compare ResourceQuota with LimitRange.
  source_readings:
  - sections/section-020/module-02/course-02-requests-limits-and-namespace-budgets.md
  prompt: A new workload passes its namespace quota but remains unscheduled with insufficient CPU on each
    node. Why is this possible?
  options:
  - id: a
    text: Quota admission and individual-node placement check different constraints.
    explanation: An aggregate budget does not guarantee a suitable node for one Pod.
  - id: b
    text: Quota acceptance reserves every node's free capacity for the Pod.
    explanation: ResourceQuota does not create or universally reserve physical capacity.
  - id: c
    text: The memory limit supplies missing CPU.
    explanation: Different resource boundaries do not substitute for requested CPU capacity.
  correct_option: a
  explanation: An aggregate budget does not guarantee a suitable node for one Pod.
- id: ats037-domain-review-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Predict the effect of taints and tolerations.
  source_readings:
  - sections/section-030/module-01/course-02-taints-tolerations-and-eligibility.md
  prompt: A specialized workload tolerates a taint but also requires a missing node label. What result
    is consistent with the rules?
  options:
  - id: a
    text: It must run on the tainted node despite the missing label.
    explanation: All mandatory placement conditions still apply.
  - id: b
    text: Its Service must create the missing accelerator.
    explanation: Services do not create hardware or node labels.
  - id: c
    text: It remains Pending because the required label still has no match.
    explanation: Tolerating a taint does not bypass affinity requirements.
  correct_option: c
  explanation: Tolerating a taint does not bypass affinity requirements.
- id: ats037-domain-review-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish a tag from a digest.
  source_readings:
  - sections/section-040/module-02/course-01-layers-tags-and-digests.md
  prompt: The team wants tested application bytes to remain identifiable across restarts and environments.
    Which choice supports that requirement?
  options:
  - id: a
    text: Use the same Pod display name everywhere.
    explanation: Names do not establish artifact identity.
  - id: b
    text: Promote the same image digest and keep environment configuration separate.
    explanation: A digest identifies content, while runtime configuration can vary independently.
  - id: c
    text: Rebuild and overwrite latest in every environment without recording identity.
    explanation: That can change bytes and weaken the link to test evidence.
  correct_option: b
  explanation: A digest identifies content, while runtime configuration can vary independently.
- id: ats037-domain-review-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Identify what controllers do and what application logic must still do.
  source_readings:
  - sections/section-010/module-04/course-01-managing-long-running-workloads.md
  prompt: A team chooses StatefulSet and assumes it now has safe database replication and backups. What
    is missing from that reasoning?
  options:
  - id: a
    text: Stable identities and storage associations do not implement the database's data protection.
    explanation: Application replication and recovery still require suitable mechanisms.
  - id: b
    text: StatefulSet prevents every node failure.
    explanation: A controller does not remove infrastructure failures.
  - id: c
    text: Every StatefulSet must be replaced by a CronJob.
    explanation: Finite scheduled tasks do not supply the database lifecycle.
  correct_option: a
  explanation: Application replication and recovery still require suitable mechanisms.
- id: ats037-domain-review-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish init containers from sidecar patterns.
  source_readings:
  - sections/section-040/module-03/course-02-init-containers-and-sidecar-patterns.md
  prompt: A preparation container must complete before a web process, and a log helper must keep running
    beside it. Which arrangement fits?
  options:
  - id: a
    text: Two regular init tasks that never terminate.
    explanation: Non-completing regular initialization blocks normal application startup.
  - id: b
    text: One Service with no application containers.
    explanation: A Service is not the executable startup mechanism.
  - id: c
    text: A regular init task plus an ongoing sidecar, with explicit shared mounts where needed.
    explanation: Completion and ongoing support are different lifecycle roles.
  correct_option: c
  explanation: Completion and ongoing support are different lifecycle roles.
